# Rebuilds the public connector index.
#
# Runs on a schedule rather than on demand because the app reads the committed
# file, not GitHub's search API: the whole point of this repository is that one
# machine spends the rate limit once a day so no install ever has to.
name: Update connectors

on:
  schedule:
    # 00:00 UTC daily. GitHub queues scheduled runs and can start them late under
    # load, which is fine — nothing downstream depends on the minute.
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # A change to how the index is built should produce the new index straight
    # away, instead of leaving main describing a file that will not match it
    # until tomorrow.
    paths:
      - 'scripts/build-index.mjs'
      - '.github/workflows/update-connectors.yml'

# A scheduled run and a manual one can collide. The newer one has strictly fresher
# data, so let it win rather than have two jobs race to commit the same file.
concurrency:
  group: update-connectors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the builder before trusting its output
        run: npm test

      - name: Rebuild the index
        id: build
        env:
          # 5,000 requests an hour instead of 60, and it is already here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Commit the index
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add connectors.json
          git commit -m 'chore: update connector index'
          # The schedule is daily and the job is cancelled by a newer run, so a
          # push that lost a race is a stale result, not one worth retrying.
          git push

      - name: Report
        run: |
          if [ '${{ steps.build.outputs.changed }}' = 'true' ]; then
            echo "### Connector index updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No change to the connector index" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r '"\(.count) connectors, \(.ok) installable, generated \(.generatedAt)"' connectors.json >> "$GITHUB_STEP_SUMMARY"
