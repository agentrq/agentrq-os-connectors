# Rebuilds the public connector catalogue.
#
# Runs on a schedule rather than on demand because a server reads the committed
# file through CONNECTORS_PUBLIC_CATALOG_URL, not GitHub's search API: the whole
# point of this repository is that one machine spends the rate limit once a day
# so no install ever has to.
name: Update connectors

on:
  schedule:
    # 00:00 UTC daily. GitHub queues scheduled runs and can start them late under
    # load, which is fine — nothing downstream depends on the minute.
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # A change to how the index is built should produce the new index straight
    # away, instead of leaving main describing a file that will not match it
    # until tomorrow.
    paths:
      - 'scripts/build-index.mjs'
      - 'scripts/manifest.mjs'
      - '.github/workflows/update-connectors.yml'

# A scheduled run and a manual one can collide. The newer one has strictly fresher
# data, so let it win rather than have two jobs race to commit the same file.
concurrency:
  group: update-connectors
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the builder before trusting its output
        run: npm test

      - name: Rebuild the catalogue
        id: build
        env:
          # 5,000 requests an hour instead of 60, and it is already here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Commit the catalogue
        if: steps.build.outputs.changed == 'true'
        env:
          # gh does not pick up GITHUB_TOKEN on its own; it wants GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Main is covered by a ruleset that requires changes through a pull
          # request, so the bot can no longer push to main directly. Open a
          # branch PR and merge it straight away: the ruleset asks for no
          # reviewers and no required checks, so the merge is immediate.
          branch="chore/update-catalogue/${{ github.run_id }}"
          # A run cancelled mid-way (a newer run cancels the older one) can
          # leave a stale PR behind; close those first so they never pile up.
          for stale in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("chore/update-catalogue/")) | .number'); do
            gh pr close "$stale"
          done
          git checkout -b "$branch"
          git add connectors.json
          git commit -m 'chore: update the connector catalogue'
          # The schedule is daily and the job is cancelled by a newer run, so a
          # push that lost a race is a stale result, not one worth retrying.
          git push -u origin "$branch"
          gh pr create --title 'chore: update the connector catalogue' \
            --body 'Automated rebuild of the public connector catalogue.' \
            --head "$branch" --base main
          gh pr merge --merge --delete-branch "$branch"

      - name: Report
        run: |
          if [ '${{ steps.build.outputs.changed }}' = 'true' ]; then
            echo "### Connector catalogue updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No change to the connector catalogue" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r '"\(.counts.listed) listed, \(.counts.warned) with warnings, \(.counts.excluded) excluded, generated \(.generatedAt)"' connectors.json >> "$GITHUB_STEP_SUMMARY"
